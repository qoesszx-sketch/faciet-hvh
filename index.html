<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FACEIT.CC | PRIVATE NETWORK</title>
    <style>
        :root { --accent: #ff4a22; --bg: #050505; --card: #0a0a0a; --border: #151515; --text: #eee; }
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        canvas#snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .app-wrapper { width: 340px; background: var(--card); border: 1px solid var(--border); position: relative; z-index: 10; box-shadow: 0 20px 50px rgba(0,0,0,0.9); transition: 0.4s; }
        .app-wrapper.expanded { width: 750px; }
        .top-line { height: 2px; background: var(--accent); }
        .padding { padding: 30px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-weight: bold; letter-spacing: 2px; font-size: 16px; text-transform: uppercase; }
        .logo span { color: var(--accent); }

        .group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; color: #555; text-transform: uppercase; margin-bottom: 5px; }
        input { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; font-size: 13px; transition: 0.3s; }
        input:focus { border-color: var(--accent); }

        .btn { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; text-transform: uppercase; font-size: 11px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px rgba(255, 74, 34, 0.3); }
        .btn:disabled { border-color: #333; color: #333; cursor: wait; }

        /* DASHBOARD */
        .nav { display: flex; border-bottom: 1px solid var(--border); background: #080808; }
        .nav-t { flex: 1; text-align: center; padding: 15px; font-size: 11px; cursor: pointer; color: #444; text-transform: uppercase; }
        .nav-t.active { color: var(--accent); border-bottom: 1px solid var(--accent); background: #0c0c0c; }

        .dashboard { display: flex; height: 450px; }
        .sidebar-stats { width: 220px; border-right: 1px solid var(--border); padding: 25px; background: #070707; text-align: center; }
        .main-view { flex: 1; padding: 30px; overflow-y: auto; }

        .lvl-icon { width: 90px; height: 90px; margin-bottom: 20px; }
        .stat-val { font-size: 20px; color: #fff; margin-bottom: 2px; font-weight: bold; }
        .stat-lbl { font-size: 10px; color: #444; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }

        #queue-label { text-align: center; font-size: 11px; color: var(--accent); margin-top: 15px; display: none; letter-spacing: 2px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="app-wrapper" id="app-container">
    <div class="top-line"></div>
    
    <div id="view-reg" class="padding">
        <div class="header"><div class="logo">FACEIT<span>.CC</span></div></div>
        <div class="group"><label>Логин</label><input type="text" id="r-login"></div>
        <div class="group"><label>Пароль</label><input type="password" id="r-pass"></div>
        <div class="group"><label>Никнейм</label><input type="text" id="r-nick"></div>
        <div class="group"><label>Инвайт-код</label><input type="text" id="r-invite"></div>
        <button class="btn" onclick="core.register()">Создать аккаунт</button>
        <div style="text-align: center; font-size: 10px; margin-top: 20px; color: #444; cursor: pointer;" onclick="core.switchView('login')">УЖЕ ЕСТЬ АККАУНТ? ВОЙТИ</div>
    </div>

    <div id="view-login" class="padding" style="display:none;">
        <div class="header"><div class="logo">FACEIT<span>.CC</span></div></div>
        <div class="group"><label>Логин</label><input type="text" id="l-login"></div>
        <div class="group"><label>Пароль</label><input type="password" id="l-pass"></div>
        <button class="btn" onclick="core.login()">Авторизоваться</button>
        <div style="text-align: center; font-size: 10px; margin-top: 20px; color: #444; cursor: pointer;" onclick="core.switchView('reg')">НЕТ АККАУНТА? РЕГИСТРАЦИЯ</div>
    </div>

    <div id="view-main" style="display:none;">
        <div class="nav">
            <div class="nav-t active">Matchmaking</div>
            <div class="nav-t">Settings</div>
        </div>
        <div class="dashboard">
            <div class="sidebar-stats">
                <img id="u-lvl-img" src="https://back.faceit.com/s3/faceit-stats/images/elo-levels/level1.png" class="lvl-icon">
                <div class="stat-val" id="u-nick">---</div>
                <div class="stat-lbl">Nickname</div>
                <div class="stat-val" id="u-elo">---</div>
                <div class="stat-lbl">Elo Rating</div>
                <div class="stat-val" id="u-matches">---</div>
                <div class="stat-lbl">Matches played</div>
            </div>
            <div class="main-view">
                <h3 style="margin-top:0; font-size: 16px; letter-spacing: 1px;">RANKED 5V5 QUEUE</h3>
                <p style="font-size: 12px; color: #666; line-height: 1.6;">Вы находитесь в закрытой сети FACEIT.CC. Нажмите кнопку ниже, чтобы начать поиск матча.</p>
                <div style="margin-top: 100px;">
                    <button class="btn" id="q-btn" onclick="core.startMatch()">Найти матч</button>
                    <div id="queue-label">ПОИСК СОПЕРНИКОВ...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /* ЭФФЕКТ СНЕГА */
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    let w, h, flakes = [];
    function initSnow() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        flakes = [];
        for(let i=0; i<80; i++) flakes.push({x:Math.random()*w, y:Math.random()*h, s:Math.random()*2+1, d:Math.random()*1});
    }
    function drawSnow() {
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = "rgba(255,255,255,0.2)";
        ctx.beginPath();
        flakes.forEach(f => {
            ctx.moveTo(f.x, f.y);
            ctx.arc(f.x, f.y, f.s, 0, Math.PI*2);
            f.y += f.s * 0.4;
            if(f.y > h) f.y = -5;
        });
        ctx.fill();
        requestAnimationFrame(drawSnow);
    }
    window.onresize = initSnow; initSnow(); drawSnow();

    /* ЛОГИКА ПРИЛОЖЕНИЯ */
    const core = {
        user: null,

        switchView(id) {
            document.getElementById('view-reg').style.display = 'none';
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('view-main').style.display = 'none';
            
            const view = document.getElementById('view-' + id);
            if(view) view.style.display = 'block';

            if(id === 'main') {
                document.getElementById('app-container').classList.add('expanded');
            } else {
                document.getElementById('app-container').classList.remove('expanded');
            }
        },

        async register() {
            const data = {
                login: document.getElementById('r-login').value,
                password: document.getElementById('r-pass').value,
                nickname: document.getElementById('r-nick').value,
                invite: document.getElementById('r-invite').value
            };

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(res.ok) {
                alert("Успешно! Теперь войдите.");
                this.switchView('login');
            } else {
                const err = await res.json();
                alert("Ошибка: " + err.error);
            }
        },

        async login() {
            const l = document.getElementById('l-login').value;
            const p = document.getElementById('l-pass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ login: l, password: p })
            });

            if(res.ok) {
                const data = await res.json();
                this.user = { login: l, ...data.user };
                this.updateUI();
                this.switchView('main');
            } else {
                alert("Неверный логин или пароль!");
            }
        },

        updateUI() {
            if(!this.user) return;
            document.getElementById('u-nick').innerText = this.user.nickname.toUpperCase();
            document.getElementById('u-elo').innerText = this.user.elo;
            document.getElementById('u-matches').innerText = this.user.matches;
            document.getElementById('u-lvl-img').src = `https://back.faceit.com/s3/faceit-stats/images/elo-levels/level${this.user.level}.png`;
        },

        async startMatch() {
            const btn = document.getElementById('q-btn');
            const lbl = document.getElementById('queue-label');
            btn.disabled = true;
            lbl.style.display = 'block';

            const res = await fetch('/api/match', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ login: this.user.login })
            });

            const data = await res.json();
            btn.disabled = false;
            lbl.style.display = 'none';

            this.user = { ...this.user, ...data.user };
            this.updateUI();
            
            alert(data.win ? `ПОБЕДА! +${data.gain} ELO` : `ПОРАЖЕНИЕ! ${data.gain} ELO`);
        }
    };
</script>
</body>
</html>
